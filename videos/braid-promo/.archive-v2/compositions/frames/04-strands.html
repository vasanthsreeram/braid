      // ---- World geometry (world px; world box is 1920x1080, content spills right) ----

      var N = 40, Y0 = 120, DY = 19;
      var FAN_END_X = 1300, RUN_END_X = 2100;
      var HOT = 14; // agent-042 strand index

      // Deterministic tag list: named tags at fixed slots, the rest seeded.
      var named = { 3: "agent-007", 14: "agent-042", 22: "agent-113", 8: "planner", 30: "human:vas" };
      function tagFor(i) {
        if (named[i]) return named[i];
        var n = (i * 97 + 31) % 997;
        if (n < 10) n += 120;
        return "agent-" + ("00" + n).slice(-3);
      }

      var strandsG = $("strands"), tracesG = $("traces"), tagsBox = $("tags");
      var strands = [], traces = [], tags = [];
      for (var i = 0; i < N; i++) {
        var y = Y0 + i * DY;
        // Monotone cubic fan: shared x-controls keep vertical order → no crossings.
        var d = "M " + BASE_X + " " + BASE_Y +
          " C 720 " + BASE_Y + ", 880 " + y + ", " + FAN_END_X + " " + y +
          " L " + RUN_END_X + " " + y;
        var hot = i === HOT ? " 04-strands-hot" : "";

        var p = document.createElementNS(SVGNS, "path");
        p.setAttribute("d", d);
        p.setAttribute("pathLength", "1");
        p.setAttribute("class", "04-strands-strand" + hot);
        p.style.strokeDasharray = "1 1";
        p.style.strokeDashoffset = "1";
        strands.push(p);

        var t = document.createElementNS(SVGNS, "path");
        t.setAttribute("d", d);
        t.setAttribute("pathLength", "1");
        t.setAttribute("class", "04-strands-trace" + hot);
        t.style.strokeDasharray = "1 1";
        t.style.strokeDashoffset = "-1"; // reverse draw: runs from strand end back to base
        traces.push(t);

        var tag = document.createElement("div");
        tag.className = "04-strands-tag" + hot;
        tag.textContent = tagFor(i);
        tag.style.top = (y - 9.5) + "px";
        tags.push(tag);
      }
      // Hot strand / trace painted last so they sit on top.
      strands.forEach(function (p, i) { if (i !== HOT) strandsG.appendChild(p); });
      strandsG.appendChild(strands[HOT]);
      traces.forEach(function (p, i) { if (i !== HOT) tracesG.appendChild(p); });
      tracesG.appendChild(traces[HOT]);
      tags.forEach(function (t) { tagsBox.appendChild(t); });

      // Chips pinned to agent-042: stem rises from the strand, chip sits on top.
      var chip1 = $("chip1"), stem1 = $("stem1"), chip2 = $("chip2"), stem2 = $("stem2");
      stem1.style.left = "1460px"; stem1.style.top = (hotY - 64) + "px"; stem1.style.height = "64px";
      chip1.style.left = "1460px"; chip1.style.top = (hotY - 64 - 42) + "px";
      stem2.style.left = "1720px"; stem2.style.top = (hotY + 2) + "px";
      // chip2 hangs below the strand on a stem.
      stem2.style.height = "58px";
      stem2.style.transformOrigin = "50% 0%";
      chip2.style.left = "1720px"; chip2.style.top = (hotY + 60) + "px";
      chip2.style.transformOrigin = "0% 0%";

      var world = $("world");
      var cam = { scale: 1, x: 0, y: 0 };
      function applyCamera() {
        world.style.transform = "translate(" + cam.x + "px, " + cam.y + "px) scale(" + cam.scale + ")";
      }
      applyCamera();

      var tl = gsap.timeline({ paused: true });

      // ===== Scene 1 (0.0–1.4s): base commit, strands split right =====
      tl.fromTo($("base"), { scale: 0.2, opacity: 0 }, { scale: 1, opacity: 1, duration: 0.35, ease: "back.out(2)" }, 0);

      tl.fromTo($("kicker"), { opacity: 0 }, { opacity: 1, duration: 0.4, ease: "power1.out" }, 0.2);
      // svg-path-draw, index-staggered from the centre strand outward (fan opens symmetric)
      strands.forEach(function (p, i) {
        var rank = Math.abs(i - (N - 1) / 2); // 0.5 .. 19.5
        var start = 0.1 + rank * 0.03;        // 0.115 .. 0.685
        if (i === HOT) start = 0.12;
        tl.to(p, { strokeDashoffset: 0, duration: 0.7, ease: "power2.out" }, start);
      });

      // ===== Scene 2 (1.4–3.2s): pan right along the fan to the tags =====
      tl.to(cam, { x: -440, duration: 1.2, ease: "power2.inOut", onUpdate: applyCamera }, 1.3);
      tags.forEach(function (t, i) {
        tl.fromTo(t, { opacity: 0, x: -12 }, { opacity: 1, x: 0, duration: 0.3, ease: "power1.out" }, 1.55 + i * 0.016);

      tl.fromTo(stem1, { scaleY: 0 }, { scaleY: 1, duration: 0.25, ease: "power2.out" }, 2.0);

      // ===== Scene 3 (3.2–5.6s): pull back to frame base + fan, traces run home =====
      // Frame world span ~[200, 2280] centred, lift for headline headroom: S=0.82.

      // On "pinned to an exact base commit" (3.8–5.1s): every strand traced back to base

      tl.set({}, {}, DUR);
      window.__timelines = window.__timelines || {};
      window.__timelines[FID] = tl;
