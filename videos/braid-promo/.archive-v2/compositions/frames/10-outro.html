  <script>
    (function () {
      var FID = "10-outro";
      var DUR = 7.988;
      var root = document.querySelector('[data-composition-id="' + FID + '"]');
      function q(sel) { return root.querySelector(sel); }
      function qa(sel) { return Array.prototype.slice.call(root.querySelectorAll(sel)); }
      function byId(id) { return q('[id="' + FID + "-" + id + '"]'); }

      // One onset array from the VO word timings: fork, triage, propose, review, merge.
      var BEATS = [0.08, 0.56, 1.2, 1.84, 2.4];
      var T_HUNDREDS = 3.04, T_ONE = 4.24, T_THIS = 5.44, T_BRAID = 5.68;

      var verbs = qa('[data-10-outro="verb"]');
      var kickers = qa('[data-10-outro="kicker"]');
      var strands = qa('[data-10-outro="s"]');
      var braids = qa('[data-10-outro="b"]');
      var lineA = byId("line-a"), lineB = byId("line-b");
      var dark = byId("dark"), orange = byId("orange"), lockup = byId("lockup");
      var mark = byId("mark"), fade = byId("fade");
      var strandSvg = byId("strand");
      var tagWords = qa('[id="10-outro-tagline"] span');
      var built = byId("built");

      // Strand geometry: three strands, each y = cy + A*sin(PI*k*x/W + phase).
      // k = twists (one per verb); A -> 0 straightens them into one clean line.
      var PH = [0, (2 * Math.PI) / 3, (4 * Math.PI) / 3];
      function buildPath(W, H, k, A, phase) {
        var cy = H / 2, n = 140, d = "";
        for (var j = 0; j <= n; j++) {
          var x = (W * j) / n;
          var y = cy + A * Math.sin((Math.PI * k * x) / W + phase);
          d += (j === 0 ? "M" : "L") + x.toFixed(2) + " " + y.toFixed(2);
        }
        return d;
      }
      var strandState = { k: 0, A: 46 };
      function drawStrand() {
        for (var i = 0; i < strands.length; i++) {
          strands[i].setAttribute("d", buildPath(1200, 160, strandState.k, strandState.A, PH[i]));
        }
      }
      var braidState = { k: 0, A: 0 };
      function drawBraid() {
        for (var i = 0; i < braids.length; i++) {
          braids[i].setAttribute("d", buildPath(900, 80, braidState.k, braidState.A, PH[i]));
        }
      }
      drawStrand();
      drawBraid();

      var tl = gsap.timeline({ paused: true });

      // ---- Macro camera: slow push on the dark register underneath the barrage ----
      tl.fromTo(dark, { scale: 1 }, { scale: 1.035, duration: T_THIS, ease: "none" }, 0);

      // ---- Scene 1: verb barrage (kinetic-beat-slam, distinct entrance per verb) ----
      tl.fromTo(strandSvg, { opacity: 0, scaleX: 0.6 }, { opacity: 1, scaleX: 1, duration: 0.4, ease: "power3.out" }, 0);

      var entrances = [
        [{ scale: 1.5, filter: "blur(16px)", opacity: 0 }, { scale: 1, filter: "blur(0px)", opacity: 1, duration: 0.32, ease: "power4.out" }],
        [{ x: -300, opacity: 0 }, { x: 0, opacity: 1, duration: 0.3, ease: "expo.out" }],
        [{ y: 110, rotation: 6, opacity: 0 }, { y: 0, rotation: 0, opacity: 1, duration: 0.36, ease: "circ.out" }],
        [{ scaleX: 1.35, scaleY: 0.86, opacity: 0 }, { scaleX: 1, scaleY: 1, opacity: 1, duration: 0.36, ease: "power3.out" }],
        [{ scale: 0.35, opacity: 0 }, { scale: 1, opacity: 1, duration: 0.42, ease: "back.out(2)" }],
      ];
      BEATS.forEach(function (t, i) {
        // hard cut: previous verb + counter vanish exactly on the next onset
        if (i > 0) {
          tl.set(verbs[i - 1], { opacity: 0 }, t);
          tl.set(kickers[i - 1], { opacity: 0 }, t);
        }
        tl.fromTo(verbs[i], entrances[i][0], entrances[i][1], t);
        tl.set(kickers[i], { opacity: 1 }, t);
        // the strand gains one twist per verb
        tl.fromTo(strandState, { k: i, A: 46 }, { k: i + 1, A: 46, duration: 0.34, ease: "power3.out", onUpdate: drawStrand, immediateRender: false }, t);
      });

      // ---- Scene 2: "hundreds of agents" -> swaps in place to "one clean history." ----
      tl.set([verbs[4], kickers[4]], { opacity: 0 }, T_HUNDREDS);
      tl.set(lineA, { opacity: 1 }, T_HUNDREDS);
      tl.fromTo(lineA.children, { y: 46, opacity: 0 }, { y: 0, opacity: 1, duration: 0.32, ease: "power3.out", stagger: 0.1 }, T_HUNDREDS);
      // hundreds of agents: strands tangle harder
      tl.fromTo(strandState, { k: 5, A: 46 }, { k: 9, A: 58, duration: 0.9, ease: "power2.out", onUpdate: drawStrand, immediateRender: false }, T_HUNDREDS);

      tl.set(lineA, { opacity: 0 }, T_ONE);
      tl.fromTo(lineB, { opacity: 0, scale: 1.08 }, { opacity: 1, scale: 1, duration: 0.28, ease: "power4.out" }, T_ONE);
      // one clean history: the tangle straightens into one clean line
      tl.fromTo(strandState, { k: 9, A: 58 }, { k: 9, A: 0, duration: 0.8, ease: "power3.inOut", onUpdate: drawStrand, immediateRender: false }, T_ONE + 0.05);

      // ---- Scene 3: register slams to ORANGE, braid + lockup ----
      tl.set(dark, { opacity: 0 }, T_THIS);
      tl.fromTo(orange, { opacity: 0, scale: 1.06 }, { opacity: 1, scale: 1, duration: 0.12, ease: "power4.out" }, T_THIS);
      tl.set(lockup, { opacity: 1 }, T_THIS);

      // the strands braid: amplitude grows + twists wind in while drawing left -> right
      tl.fromTo(braids, { strokeDasharray: 1400, strokeDashoffset: 1400 }, { strokeDashoffset: 0, duration: 0.7, ease: "power3.out" }, T_THIS);
      tl.fromTo(braidState, { k: 0, A: 0 }, { k: 7, A: 22, duration: 0.8, ease: "power3.out", onUpdate: drawBraid, immediateRender: false }, T_THIS);

      // wordmark slams on "Braid"
      tl.fromTo(mark, { opacity: 0, scale: 1.6, filter: "blur(18px)" }, { opacity: 1, scale: 1, filter: "blur(0px)", duration: 0.34, ease: "power4.out" }, T_BRAID);
      // tagline builds word by word
      tl.fromTo(tagWords, { y: 30, opacity: 0 }, { y: 0, opacity: 1, duration: 0.36, ease: "power3.out", stagger: 0.07 }, 6.0);
      // mono sign-off
      tl.fromTo(built, { opacity: 0, scaleX: 1.3 }, { opacity: 1, scaleX: 1, duration: 0.5, ease: "expo.out" }, 6.42);
      // final playful slam on "braid": squash, then spring back and hold still
      tl.fromTo(mark, { scaleX: 1, scaleY: 1 }, { scaleX: 1.07, scaleY: 0.9, duration: 0.09, ease: "power2.in", immediateRender: false }, 6.24);
      tl.fromTo(mark, { scaleX: 1.07, scaleY: 0.9 }, { scaleX: 1, scaleY: 1, duration: 0.55, ease: "elastic.out(1.1, 0.45)", immediateRender: false }, 6.33);

      // ---- Final frame only: last 0.4s fade to ink ----
      tl.fromTo(fade, { opacity: 0 }, { opacity: 1, duration: 0.4, ease: "power1.in" }, DUR - 0.4);

      // pad timeline to the exact render length
      tl.set({}, {}, DUR);

      window.__timelines = window.__timelines || {};
      window.__timelines[FID] = tl;
    })();
