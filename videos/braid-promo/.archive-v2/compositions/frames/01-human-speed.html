    <style>

    <div id="hs-ground" class="clip" data-start="0" data-duration="8.408" data-track-index="0"></div>

    <div id="hs-stage" class="clip" data-start="0" data-duration="8.408" data-track-index="1">
      <div id="hs-kicker">
        <div id="hs-rule"></div>
        <div id="hs-kicker-text"></div>
      </div>

      <div class="hs-head" id="hs-head-a">built for human speed.</div>
      <div class="hs-head" id="hs-head-b">agents <span class="hs-hot">aren't.</span></div>

      <div class="hs-gauge" id="hs-g1">
        <svg viewBox="0 0 520 600"></svg>
        <div class="hs-needle" id="hs-n1"></div>

      <div class="hs-gauge" id="hs-g2">
        <svg viewBox="0 0 520 600"></svg>
        <div class="hs-needle" id="hs-n2"></div>
        <div class="hs-hub"></div>
        <div class="hs-readout" id="hs-r2">0h 00m</div>

        <div id="hs-pile"></div>
      </div>

      <div class="hs-gauge" id="hs-g3">
        <svg viewBox="0 0 520 600"></svg>
        <div class="hs-needle" id="hs-n3"></div>
        <div class="hs-hub"></div>
        <div class="hs-readout" id="hs-r3">0</div>
        <div class="hs-label" id="hs-l3">Untriaged issues</div>

      </div>

    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <script>
      (function () {
        var DUR = 8.008;
        var root = document.querySelector('[data-composition-id="01-human-speed"]');
        var q = function (sel) { return root.querySelector(sel); };
        var tl = gsap.timeline({ paused: true });
        var SVGNS = "http://www.w3.org/2000/svg";

        // exact word onsets — audio_meta.json, frame 3
        var W = {
          today: 0.08, run: 0.96, human: 1.36, speed: 1.76,
          agents: 2.32, dont: 2.8, review: 3.36, queues: 3.84, explode: 4.4,
          merges: 5.04, pile: 5.52, up: 5.84, nobody: 6.24, triages: 6.56, anything: 7.28
        };

        // deterministic hash in [0,1)
        function hash(n) { var h = Math.sin(n * 12.9898 + 78.233) * 43758.5453; return h - Math.floor(h); }

        // ---- gauge geometry (svg space == gauge box space) ----
        var CX = 260, CY = 530, R = 190;
        function pt(deg, r) { // deg: 180 = left, 90 = top, 0 = right
          var a = deg * Math.PI / 180;
          return [CX + r * Math.cos(a), CY - r * Math.sin(a)];
        }
        var TRACK_LEN = Math.PI * R;
        var ZONE_LEN = Math.PI * (R + 6) / 4;

        var gauges = [1, 2, 3].map(function (n) {
          var g = q("#hs-g" + n);
          var svg = g.querySelector("svg");
          var p0 = pt(180, R), p1 = pt(0, R);
          var track = document.createElementNS(SVGNS, "path");
          track.setAttribute("class", "hs-track");
          track.setAttribute("d", "M " + p0[0] + " " + p0[1] + " A " + R + " " + R + " 0 0 1 " + p1[0] + " " + p1[1]);
          track.style.strokeDasharray = TRACK_LEN;
          track.style.strokeDashoffset = TRACK_LEN;
          var z0 = pt(45, R + 6), z1 = pt(0, R + 6);
          var zone = document.createElementNS(SVGNS, "path");
          zone.setAttribute("class", "hs-zone");
          zone.setAttribute("d", "M " + z0[0] + " " + z0[1] + " A " + (R + 6) + " " + (R + 6) + " 0 0 1 " + z1[0] + " " + z1[1]);
          zone.style.strokeDasharray = ZONE_LEN;
          zone.style.strokeDashoffset = ZONE_LEN;
          var base = document.createElementNS(SVGNS, "line");
          base.setAttribute("class", "hs-base");
          base.setAttribute("x1", CX - R - 30); base.setAttribute("y1", CY + 0.5);
          base.setAttribute("x2", CX + R + 30); base.setAttribute("y2", CY + 0.5);
          svg.appendChild(base);
          svg.appendChild(track);
          svg.appendChild(zone);
          var ticks = [];
          for (var i = 0; i <= 10; i++) {
            var deg = 180 - i * 18;
            var a = pt(deg, R - 22), b = pt(deg, R - (i % 5 === 0 ? 50 : 38));
            var t = document.createElementNS(SVGNS, "line");
            t.setAttribute("class", "hs-tick" + (deg <= 45 ? " hs-tick-hot" : ""));
            t.setAttribute("x1", a[0]); t.setAttribute("y1", a[1]);
            t.setAttribute("x2", b[0]); t.setAttribute("y2", b[1]);
            svg.appendChild(t);
            ticks.push(t);
          }
          return {
            g: g, track: track, zone: zone, base: base, ticks: ticks,
            needle: q("#hs-n" + n), hub: g.querySelector(".hs-hub"),
            readout: q("#hs-r" + n), label: q("#hs-l" + n)
          };
        });

        // ---- macro camera: slow push under the whole shot ----
        tl.fromTo(q("#hs-stage"), { scale: 1 }, { scale: 1.03, duration: DUR, ease: "none" }, 0);

        // ===== Scene 1 (0.0–2.2): kicker types, h1 lands, gauges draw on =====
        tl.fromTo(q("#hs-rule"), { scaleX: 0 }, { scaleX: 1, duration: 0.3, ease: "expo.out" }, 0.04);
        var KICK = "SCENARIO · 100 AGENTS · ONE REPO · ONE DAY";
        var kt = q("#hs-kicker-text");
        var kStep = (W.run - W.today) / KICK.length;
        for (var k = 0; k < KICK.length; k++) {
          var s = document.createElement("span");
          s.textContent = KICK.charAt(k);
          kt.appendChild(s);
          tl.fromTo(s, { opacity: 0 }, { opacity: 1, duration: 0.01, ease: "none" }, W.today + k * kStep);
        }

        tl.fromTo(q("#hs-head-a"),
          { y: 60, opacity: 0 },
          { y: 0, opacity: 1, duration: 0.5, ease: "expo.out" }, W.run);

        gauges.forEach(function (G, i) {
          var t0 = 0.4 + i * 0.2;
          tl.fromTo(G.base, { opacity: 0 }, { opacity: 1, duration: 0.4, ease: "power1.out" }, t0);
          tl.fromTo(G.track, { strokeDashoffset: TRACK_LEN }, { strokeDashoffset: 0, duration: 0.8, ease: "power2.out" }, t0);
          G.ticks.forEach(function (t, j) {
            tl.fromTo(t, { opacity: 0 }, { opacity: 1, duration: 0.12, ease: "none" }, t0 + 0.08 + j * 0.06);
          });
          tl.fromTo(G.zone, { strokeDashoffset: ZONE_LEN }, { strokeDashoffset: 0, duration: 0.35, ease: "power2.out" }, t0 + 0.62);
          tl.fromTo(G.hub, { scale: 0 }, { scale: 1, duration: 0.3, ease: "back.out(2)" }, t0 + 0.1);
          tl.fromTo(G.needle, { rotation: -88, scaleY: 0 }, { rotation: -88, scaleY: 1, duration: 0.35, ease: "power3.out" }, t0 + 0.2);
          tl.fromTo(G.readout, { opacity: 0, scale: 0.5 }, { opacity: 0.35, scale: 0.5, duration: 0.3, ease: "power1.out" }, W.human + i * 0.12);
          tl.fromTo(G.label, { opacity: 0, y: 12 }, { opacity: 1, y: 0, duration: 0.4, ease: "power2.out" }, W.human + 0.1 + i * 0.12);
        });

        // ===== Scene 2 (2.2–3.3): hard-cut word swap + needles twitch =====
        tl.fromTo(q("#hs-head-b"), { opacity: 0 }, { opacity: 1, duration: 0.01, ease: "none" }, W.agents);
        tl.to(q("#hs-head-a"), { opacity: 0, duration: 0.01, ease: "none" }, W.agents);
        tl.fromTo(q("#hs-head-b"), { scale: 1.06 }, { scale: 1, duration: 0.35, ease: "power3.out" }, W.agents);
        gauges.forEach(function (G, i) {
          tl.to(G.needle, { rotation: -70 + i * 3, duration: 0.14, ease: "power3.out" }, W.agents + 0.04 + i * 0.03);
          tl.to(G.needle, { rotation: -84, duration: 0.5, ease: "power2.inOut" }, W.agents + 0.22 + i * 0.03);
        });

        // ===== count-up helpers (counting-dynamic-scale) =====
        function countUp(G, target, start, dur, fmt) {
          var st = { v: 0 };
          tl.fromTo(st, { v: 0 }, {
            v: target, duration: dur, ease: "power3.out", immediateRender: false,
            onUpdate: function () { G.readout.textContent = fmt(st.v); }
          }, start);
          tl.fromTo(G.readout, { scale: 0.5, opacity: 0.35 }, { scale: 1, opacity: 1, duration: dur, ease: "power3.out", immediateRender: false }, start);
          tl.fromTo(G.readout, { color: "#b8b0a3" }, { color: "#ff681e", duration: 0.25, ease: "none", immediateRender: false }, start);
          tl.fromTo(G.needle, { backgroundColor: "#fffdf8" }, { backgroundColor: "#ff681e", duration: 0.2, ease: "none", immediateRender: false }, start + dur * 0.55);
        }
        function fmtInt(v) { return Math.round(v).toLocaleString("en-US"); }
        function fmtHM(v) { var m = Math.round(v); var mm = m % 60; return Math.floor(m / 60) + "h " + (mm < 10 ? "0" : "") + mm + "m"; }

        function shake(el, at, amp) {
          var seq = [1, -0.85, 0.6, -0.4, 0.2, 0];
          seq.forEach(function (f, i) {
            tl.to(el, { x: f * amp, y: (i % 2 ? 1 : -1) * f * amp * 0.35, duration: 0.045, ease: "none" }, at + i * 0.045);
          });
        }

        // ===== Scene 3 (3.3–4.9): gauge 1 sweeps into the zone, counts to 2,400, shakes =====
        var G1 = gauges[0], G2 = gauges[1], G3 = gauges[2];
        tl.to(G1.needle, { rotation: 78, duration: 1.04, ease: "power3.out" }, W.review);
        countUp(G1, 2400, W.review, 1.24, fmtInt);
        shake(G1.g, W.explode, 12);

        // ===== Scene 4 (4.9–6.4): gauge 2 to the limit, 3h 12m, proposal pile =====
        tl.to(G2.needle, { rotation: 86, duration: 0.86, ease: "power3.out" }, W.merges);
        countUp(G2, 192, W.merges, 1.2, fmtHM);
        var pile = q("#hs-pile");
        var NCARDS = 7;
        for (var c = 0; c < NCARDS; c++) {
          var card = document.createElement("div");
          card.className = "hs-card";
          card.style.top = (128 - c * 21) + "px";
          pile.appendChild(card);
          var jx = (hash(c + 3) - 0.5) * 22;
          var jr = (hash(c + 11) - 0.5) * 3;
          tl.fromTo(card,
            { y: -70, x: jx, rotation: jr * 2.5, opacity: 0 },
            { y: 0, x: jx, rotation: jr, opacity: 1, duration: 0.22, ease: "power3.in" },
            W.pile - 0.2 + c * 0.09);
        }
        tl.fromTo(pile, { y: 0 }, { y: 3, duration: 0.06, ease: "power2.out" }, W.pile - 0.2 + NCARDS * 0.09 + 0.12);
        tl.to(pile, { y: 0, duration: 0.2, ease: "power2.out" }, W.pile - 0.2 + NCARDS * 0.09 + 0.18);

        // ===== Scene 5 (6.4–8.0): gauge 3 slams to the stop, 918, UNASSIGNED stamp, jitter =====
        tl.to(G3.needle, { rotation: 93, duration: 0.36, ease: "power4.in" }, W.nobody);
        tl.to(G3.needle, { rotation: 87, duration: 0.1, ease: "power2.out" }, W.nobody + 0.36);
        tl.to(G3.needle, { rotation: 90, duration: 0.14, ease: "power2.inOut" }, W.nobody + 0.46);
        shake(G3.g, W.nobody + 0.36, 10);
        countUp(G3, 918, W.nobody, 1.04, fmtInt);

        var stamp = q("#hs-stamp");
        tl.fromTo(stamp,
          { scale: 1.9, rotation: -9, opacity: 0 },
          { scale: 1, rotation: -3, opacity: 1, duration: 0.2, ease: "power4.out" }, W.anything);
        shake(G3.g, W.anything + 0.18, 6);

        // needles jitter against their stops — deterministic, to the cut
        var JSTEP = 0.06;
        [[G1, 78, W.explode + 0.1], [G2, 86, W.up + 0.08], [G3, 90, W.nobody + 0.62]].forEach(function (row, gi) {
          var G = row[0], baseRot = row[1], tStart = row[2];
          var n = 0;
          for (var t = tStart; t + JSTEP <= DUR; t += JSTEP) {
            var amp = t >= W.anything ? 2.4 : 1.3;
            var rot = baseRot + (hash(gi * 997 + n) - 0.5) * 2 * amp;
            if (gi === 2 && rot > 90.5) rot = 90.5 - (rot - 90.5); // pinned against the stop
            tl.to(G.needle, { rotation: rot, duration: JSTEP, ease: "none" }, t);
            n++;
          }
        });

        // pin timeline length to the frame duration
        tl.set({}, {}, DUR);

        window.__timelines = window.__timelines || {};
        window.__timelines["01-human-speed"] = tl;
      })();
    </script>
