        chars.forEach(function (c, i) {
          tl.fromTo(c, { opacity: 0 }, { opacity: 1, duration: 0.01, ease: "none" }, typeStart + i * step);

        // ---- Scene 2: kinetic beat-slam — distinct entrance per word, on spoken cues ----
