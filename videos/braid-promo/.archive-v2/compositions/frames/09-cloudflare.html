  <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
  <script>
    (function () {
      const ID = "09-cloudflare";
      const DUR = 9.943;
      const root = document.querySelector('[data-composition-id="' + ID + '"]');
      const q = (cls) => Array.from(root.querySelectorAll('[class~="' + ID + "-" + cls + '"]'));
      const q1 = (cls) => q(cls)[0];
      const SVGNS = "http://www.w3.org/2000/svg";

      // ONE shared center — the braid mark's rendered center (hub 760,310 + mark 80,65 + 120,55).
      const C = { x: 960, y: 430 };
      const RX = 630;
      const RY = 280;

      // ---------- braid mark: three strands, 120deg out of phase ----------
      const strands = q("strand");
      function braidPath(phase) {
        let d = "";
        for (let i = 0; i <= 48; i++) {
          const x = (i / 48) * 240;
          const y = 55 + 34 * Math.sin((x / 240) * Math.PI * 4 + phase);
          d += (i === 0 ? "M" : "L") + x.toFixed(2) + " " + y.toFixed(2) + " ";
        }
        return d;
      }
      const braid = { p: 0 };
      function drawBraid() {
        strands.forEach((s, k) => s.setAttribute("d", braidPath(braid.p + (k * Math.PI * 2) / 3)));
      }
      drawBraid();

      // ---------- nodes on the upper arc of the ellipse (left -> over the top -> right) ----------
      // The lower band of the frame is reserved for the stamp + struck list.
      const nodes = q("node");
      const svg = q1("lines");
      const angles = [170, 220, 270, 320, 370].map((a) => (a * Math.PI) / 180);
      const lines = [];
      const pts = [];
      nodes.forEach((n, i) => {
        const x = C.x + Math.cos(angles[i]) * RX;
        const y = C.y + Math.sin(angles[i]) * RY;
        pts.push({ x, y });
        n.style.left = x + "px";
        n.style.top = y + "px";
        const line = document.createElementNS(SVGNS, "line");
        const len = Math.hypot(x - C.x, y - C.y);
        line.setAttribute("x1", C.x);
        line.setAttribute("y1", C.y);
        line.setAttribute("x2", x);
        line.setAttribute("y2", y);
        line.setAttribute("stroke", "rgba(17,17,17,0.55)");
        line.setAttribute("stroke-width", "1.5");
        line.setAttribute("stroke-dasharray", len + " " + len);
        line.style.strokeDashoffset = String(len);
        svg.appendChild(line);
        lines.push(line);
      });

      // orbit arc (hairline) from node 0 over the top to node 4 — length summed numerically
      let arcLen = 0;
      for (let k = 0; k < 200; k++) {
        const a0 = angles[0] + ((angles[4] - angles[0]) * k) / 200;
        const a1 = angles[0] + ((angles[4] - angles[0]) * (k + 1)) / 200;
        arcLen += Math.hypot((Math.cos(a1) - Math.cos(a0)) * RX, (Math.sin(a1) - Math.sin(a0)) * RY);
      }
      const arc = document.createElementNS(SVGNS, "path");
      arc.setAttribute("d", "M " + pts[0].x + " " + pts[0].y + " A " + RX + " " + RY + " 0 1 1 " + pts[4].x + " " + pts[4].y);
      arc.setAttribute("fill", "none");
      arc.setAttribute("stroke", "rgba(17,17,17,0.2)");
      arc.setAttribute("stroke-width", "1");
      arc.setAttribute("stroke-dasharray", arcLen + " " + arcLen);
      arc.style.strokeDashoffset = String(arcLen);
      svg.insertBefore(arc, svg.firstChild);

      // ---------- list: split each line into per-char spans for the type-on ----------
      const typeEls = q("type");
      const typeLines = typeEls.map((el) => {
        const text = el.textContent;
        el.textContent = "";
        return Array.from(text).map((ch) => {
          const s = document.createElement("span");
          s.textContent = ch;
          el.appendChild(s);
          return s;
        });
      });

      const tl = gsap.timeline({ paused: true });
      const cam = q1("camera");
      const mark = q1("mark");
      const pops = q("pop");
      const dots = q("dot");
      const labels = q("label");
      const stamp = q1("stamp");
      const items = q("item");
      const strikes = q("strike");
      const row = q1("row");

      gsap.set(cam, { transformOrigin: C.x + "px " + C.y + "px", scale: 1 });
      gsap.set(pops, { transformOrigin: "0px 0px" });

      // ---------- Scene 1 (0.0–1.8s): braid mark at center; kicker on "native on Cloudflare" ----------
      tl.fromTo(mark, { scale: 0.82, transformOrigin: "50% 50%" }, { scale: 1, duration: 0.55, ease: "back.out(1.6)" }, 0);
      tl.fromTo(q1("markrect"), { attr: { width: 40 } }, { attr: { width: 260 }, duration: 0.7, ease: "power2.out" }, 0);
      // continuous slow twist of the strands across the whole shot (seek-safe proxy)
      tl.fromTo(braid, { p: 0 }, { p: -Math.PI * 2.4, duration: DUR, ease: "none", onUpdate: drawBraid }, 0);
      tl.fromTo(q1("kicker"), { opacity: 0, y: 14 }, { opacity: 1, y: 0, duration: 0.45, ease: "power3.out" }, 0.56);
      tl.fromTo(q1("stub"), { scaleX: 0, transformOrigin: "50% 50%" }, { scaleX: 1, duration: 0.4, ease: "power2.out" }, 0.72);

      // macro camera drift underneath (slow push), 0 → 9.12s
      tl.fromTo(cam, { scale: 1 }, { scale: 1.06, duration: 9.12, ease: "sine.inOut" }, 0);

      // ---------- Scene 2 (1.8–5.6s): arc draws, nodes spring in on their words ----------
      tl.to(arc, { strokeDashoffset: 0, duration: 1.4, ease: "power2.inOut" }, 1.5);

      const cues = [1.92, 2.4, 3.12, 4.08, 4.8]; // Workers, Artifacts, Durable, D1, Workers (AI)
      cues.forEach((t, i) => {
        tl.fromTo(pops[i], { scale: 0, opacity: 0 }, { scale: 1, opacity: 1, duration: 0.55, ease: "back.out(1.7)" }, t - 0.06);
        tl.fromTo(labels[i], { opacity: 0, y: i === 0 || i === 4 ? -8 : 8 }, { opacity: 1, y: 0, duration: 0.32, ease: "power2.out" }, t + 0.02);
        tl.to(lines[i], { strokeDashoffset: 0, duration: 0.5, ease: "power2.out" }, t + 0.05);
        tl.fromTo(dots[i], { scale: 1.35 }, { scale: 1, duration: 0.4, ease: "power2.out" }, t + 0.4);
      });

      // breathing dwell on the formed network (out-of-phase, one proxy), 5.6 → 9.12
      const breath = { p: 0 };
      tl.fromTo(
        breath,
        { p: 0 },
        {
          p: Math.PI * 2 * 1.5,
          duration: 9.12 - 5.6,
          ease: "none",
          onUpdate: () => {
            dots.forEach((d, i) => gsap.set(d, { scale: 1 + Math.sin(breath.p + (i / dots.length) * Math.PI * 2) * 0.06 }));
          },
        },
        5.6,
      );

      // ---------- Scene 3 (5.6–7.6s): "agent runtime: built in" stamp slams under the core ----------
      const SLAM = 6.16; // "agent"
      // ring steps back so the stamp owns the beat (a dim, not an exit)
      tl.to(nodes, { opacity: 0.42, duration: 0.45, ease: "power2.out" }, SLAM);
      tl.to(svg, { opacity: 0.5, duration: 0.45, ease: "power2.out" }, SLAM);
      tl.fromTo(
        stamp,
        { opacity: 0, scale: 2.1, rotation: -7, transformOrigin: "50% 50%" },
        { opacity: 1, scale: 1, rotation: -2, duration: 0.22, ease: "power4.in" },
        SLAM - 0.2,
      );
      // impact: squash + elastic settle, row jolt
      tl.to(stamp, { scaleY: 0.92, scaleX: 1.04, duration: 0.06, ease: "power1.out" }, SLAM + 0.02);
      tl.to(stamp, { scaleY: 1, scaleX: 1, duration: 0.4, ease: "elastic.out(1, 0.45)" }, SLAM + 0.08);
      tl.fromTo(row, { y: 0 }, { y: 7, duration: 0.05, ease: "power1.out" }, SLAM + 0.02);
      tl.to(row, { y: 0, duration: 0.45, ease: "elastic.out(1, 0.4)" }, SLAM + 0.07);
      // "built in" — the stamp straightens
      tl.to(stamp, { rotation: 0, duration: 0.3, ease: "back.out(2.4)" }, 7.04);

      // ---------- Scene 4 (7.6–9.0s): mono list types beside the stamp, each line struck through ----------
      const typeAt = [7.6, 7.84, 8.08];
      const strikeAt = [8.0, 8.24, 8.56]; // "nothing", "for you", "host"
      typeLines.forEach((chars, i) => {
        tl.fromTo(items[i], { opacity: 0 }, { opacity: 1, duration: 0.01 }, typeAt[i]);
        tl.fromTo(chars, { opacity: 0 }, { opacity: 1, duration: 0.01, stagger: 0.2 / chars.length, ease: "none" }, typeAt[i]);
        tl.fromTo(strikes[i], { scaleX: 0, transformOrigin: "0% 50%" }, { scaleX: 1, duration: 0.18, ease: "power3.out" }, strikeAt[i]);
        tl.to(typeEls[i], { opacity: 0.5, duration: 0.25, ease: "power1.out" }, strikeAt[i] + 0.12);
      });

      // ---------- Scene 5 (9.12–9.943s): "Nothing." — hard push into the braid core ----------
      const PUSH = 9.12;
      const PD = DUR - PUSH;
      tl.to(cam, { scale: 7.5, duration: PD, ease: "power3.in" }, PUSH);
      tl.to(nodes, { filter: "blur(10px)", duration: PD, ease: "power2.in" }, PUSH);
      tl.to(svg, { filter: "blur(5px)", duration: PD, ease: "power2.in" }, PUSH);
      tl.to(row, { filter: "blur(12px)", duration: PD, ease: "power2.in" }, PUSH);
      tl.to(q1("kicker"), { filter: "blur(4px)", duration: PD, ease: "power2.in" }, PUSH);

      window.__timelines = window.__timelines || {};
      window.__timelines[ID] = tl;
    })();
  </script>
