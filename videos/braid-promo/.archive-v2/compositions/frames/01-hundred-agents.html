      <svg data-hf-id="hf-7l7y" id="01-hundred-agents-strand" viewBox="0 0 1920 1080" xmlns="http://www.w3.org/2000/svg">
        <path data-hf-id="hf-mfb4" id="01-hundred-agents-strand-path" d="M 160 800 L 1960 800" />

    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <script>
      (function () {
        const FID = "01-hundred-agents";
        const $ = (s) => document.getElementById(FID + "-" + s);
        const stage = $("stage");
        const dotsLayer = $("dots");
        const seed = $("seed");
        const kicker = $("kicker");
        const numwrap = $("numwrap");
        const count = $("count");
        const plus = $("plus");
        const path = $("strand-path");
        const node = $("strand-node");
        const mainLabel = $("main");

        // ---- timing (voiceover cues) ----
        const T_HUNDRED = 0.2; // "hundred" — count bursts
        const T_AGENTS = 0.6; // "agents" — slam + fling
        const T_REPO = 1.3; // "one repo" — strand draws, numeral lifts
        const T_GO = 2.2; // "go" — stampede (frame cuts mid-flight)
        const END = 2.94;

        // ---- deterministic pseudo-random from index ----
        const rnd = (i, k) => {
          const v = Math.sin(i * 12.9898 + k * 78.233) * 43758.5453;
          return v - Math.floor(v);
        };

        // ---- build ~100 agent dots: ring positions from index ----
        const N = 100;
        const CX = 960;
        const CY = 440;
        const RX = 860;
        const RY = 320;
        const STRAND_Y = 800;
        const dots = [];
        for (let i = 0; i < N; i++) {
          const a = (i / N) * Math.PI * 2 + (rnd(i, 1) - 0.5) * 0.09;
          const rf = 0.74 + rnd(i, 2) * 0.32;
          const x = CX + Math.cos(a) * RX * rf;
          const y = CY + Math.sin(a) * RY * rf;
          const tx = 160 + ((Math.cos(a) + 1) / 2) * 1600 + (rnd(i, 3) - 0.5) * 80;
          const ty = STRAND_Y;
          const size = 9 + Math.round(rnd(i, 4) * 8);
          const pos = document.createElement("div");
          pos.className = FID + "-dotpos";
          const dot = document.createElement("div");
          dot.className = FID + "-dot";
          dot.style.width = size + "px";
          dot.style.height = size + "px";
          dot.style.left = -size / 2 + "px";
          dot.style.top = -size / 2 + "px";
          pos.appendChild(dot);
          dotsLayer.appendChild(pos);
          const ang = (Math.atan2(ty - y, tx - x) * 180) / Math.PI;
          dots.push({ pos, dot, x, y, tx, ty, ang });
        }

        // strand path draw setup (measured)
        const len = path.getTotalLength();
        path.style.strokeDasharray = String(len);
        path.style.strokeDashoffset = String(len);

        const tl = gsap.timeline({ paused: true });

        // ---- camera: slow lean-in under the whole shot ----
        tl.fromTo(stage, { scale: 1 }, { scale: 1.03, duration: T_GO, ease: "none" }, 0);

        // ---- Scene 1 (0–0.6): dark, one dot, kicker; count bursts on "hundred" ----
        tl.fromTo(seed, { scale: 0.4, opacity: 0 }, { scale: 1, opacity: 1, duration: 0.15, ease: "power3.out" }, 0);
        tl.fromTo(kicker, { opacity: 0, y: 10 }, { opacity: 1, y: 0, duration: 0.15, ease: "power2.out" }, 0.02);
        tl.to(seed, { scale: 0, duration: 0.14, ease: "power2.out" }, T_HUNDRED);
        tl.to(kicker, { y: -232, duration: 0.25, ease: "power3.out" }, T_HUNDRED);

        const COUNT_DUR = T_AGENTS - T_HUNDRED;
        const START_SCALE = 0.4;
        const state = { value: 1 };
        count.textContent = "1";
        tl.fromTo(count, { opacity: 0 }, { opacity: 1, duration: 0.06, ease: "none" }, T_HUNDRED);
        tl.fromTo(
          state,
          { value: 1 },
          {
            value: 100,
            duration: COUNT_DUR,
            ease: "power2.out",
            onUpdate: () => {
              count.textContent = String(Math.round(state.value));
            },
          },
          T_HUNDRED,
        );
        tl.fromTo(count, { scale: START_SCALE }, { scale: 1, duration: COUNT_DUR, ease: "power2.out" }, T_HUNDRED);

        // ---- Scene 2 (0.6–1.3): slam "100+" + dots fling outward into a ring ----
        tl.fromTo(numwrap, { scale: 1.12 }, { scale: 1, duration: 0.28, ease: "power3.out" }, T_AGENTS);
        tl.fromTo(
          plus,
          { opacity: 0, y: 60, scale: 0.6 },
          { opacity: 1, y: 0, scale: 1, duration: 0.32, ease: "back.out(1.8)" },
          T_AGENTS,
        );
        dots.forEach((d, i) => {
          tl.fromTo(
            d.pos,
            { x: CX, y: CY, opacity: 0, scale: 0.4 },
            { x: d.x, y: d.y, opacity: 1, scale: 1, duration: 0.6, ease: "expo.out" },
            T_AGENTS + (i % 25) * 0.004,
          );
          // dots carry their aim from the start (rotation invisible on a circle until stretched)
          tl.set(d.dot, { rotation: d.ang }, 0);
        });

        // ---- Scene 3 (1.3–2.2): main strand draws; numeral lifts to top third; dots aim ----
        tl.to(path, { strokeDashoffset: 0, duration: 0.55, ease: "power2.out" }, T_REPO);
        tl.fromTo(node, { scale: 0, svgOrigin: "160 800" }, { scale: 1, duration: 0.3, ease: "back.out(1.6)" }, T_REPO);
        tl.fromTo(mainLabel, { opacity: 0, x: -16 }, { opacity: 1, x: 0, duration: 0.3, ease: "power2.out" }, T_REPO + 0.1);
        tl.to(numwrap, { y: -235, scale: 0.4, duration: 0.6, ease: "power3.inOut" }, T_REPO);
        tl.to(kicker, { y: -330, duration: 0.6, ease: "power3.inOut" }, T_REPO);
        dots.forEach((d) => {
          // each agent leans toward its landing point on main and stretches into an arrow-ish capsule
          tl.to(
            d.pos,
            { x: d.x + (d.tx - d.x) * 0.06, y: d.y + (d.ty - d.y) * 0.06, duration: 0.8, ease: "power2.out" },
            T_REPO + 0.1,
          );
          tl.to(d.dot, { scaleX: 1.9, duration: 0.5, ease: "power2.out" }, T_REPO + 0.2);
        });

        // ---- Scene 4 (2.2–2.94): stampede toward main — cut lands mid-flight at peak velocity ----
        dots.forEach((d, i) => {
          const delay = rnd(i, 5) * 0.08;
          tl.to(d.pos, { x: d.tx, y: d.ty, duration: 1.0, ease: "power2.in" }, T_GO + delay);
          tl.to(d.dot, { scaleX: 9, scaleY: 0.8, duration: 1.0, ease: "power2.in" }, T_GO + delay);
        });
        tl.fromTo(dotsLayer, { filter: "blur(0px)" }, { filter: "blur(2px)", duration: END - T_GO, ease: "power2.in" }, T_GO);
        tl.fromTo(stage, { scale: 1.03 }, { scale: 1.08, duration: END - T_GO, ease: "power2.in", immediateRender: false }, T_GO);

        window.__timelines = window.__timelines || {};
        window.__timelines["01-hundred-agents"] = tl;
      })();
    </script>
