  <script>
    (function () {
      var FID = "08-fenced-merge";
      var root = document.querySelector('[data-composition-id="' + FID + '"]');
      var $ = function (id) {
        return root.querySelector('[id="' + FID + "-" + id + '"]');
      };
      var DUR = 7.079;
      var tl = gsap.timeline({ paused: true });

      var stage = $("stage");
      var gate = $("gate");
      var bar = $("bar");
      var posts = root.querySelectorAll('[class~="08-fenced-merge-post"]');
      var label = $("label");
      var kicker = $("kicker");
      var cardsLayer = $("cards");
      var dotsLayer = $("dots");
      var fill = $("strand-fill");
      var readout = $("readout");
      var chip = $("chip");

      // ---- geometry ----
      var GATE_X = 800; // card center at gate
      var CARD_HALF = 65;
      var SLOTS = [640, 480, 320, 160, 0]; // queue slots (card centers), slot 0 = front
      var DOT_X0 = 940;
      var DOT_GAP = 44;
      var STRAND_L = 900;
      var STRAND_W = 940;

      // ---- event schedule: one publisher at a time ----
      // kind: "pass" = CAS succeeds, card merges; "stale" = base moved, card held
      var EVENTS = [
        { t: 1.75, kind: "pass" }, // "one publisher at a time"
        { t: 2.72, kind: "pass" }, // "compare and swap"
        { t: 3.18, kind: "stale" }, // stale base bounces
        { t: 3.62, kind: "pass" },
        { t: 4.0, kind: "pass" },
      ];
      // "hundreds racing" — torrent, rapid one-at-a-time cadence
      var TORRENT_START = 4.36;
      var TORRENT_GAP = 0.094;
      var TORRENT_N = 16;
      for (var k = 0; k < TORRENT_N; k++) {
        EVENTS.push({ t: +(TORRENT_START + k * TORRENT_GAP).toFixed(3), kind: "pass", fast: true });
      }
      var NE = EVENTS.length;
      var NCARDS = NE + SLOTS.length; // queue keeps refilling — race never stops

      // deterministic hash chain
      var seed = 0x5eed08;
      function hex7() {
        seed = (seed * 1103515245 + 12345) >>> 0;
        var a = seed.toString(16);
        seed = (seed * 1103515245 + 12345) >>> 0;
        return (a + seed.toString(16) + "0000000").slice(0, 7);
      }
      var head = "a1f3c9e";
      var firstNew = "7e2d10b";

      var CHECK =
        '<svg width="22" height="22" viewBox="0 0 22 22"><path d="M3 11.5 L9 17 L19 5" fill="none" stroke="#ff681e" stroke-width="3.2" stroke-linecap="square"/></svg>';
      var CROSS =
        '<svg width="20" height="20" viewBox="0 0 20 20"><path d="M3 3 L17 17 M17 3 L3 17" fill="none" stroke="#ff681e" stroke-width="3.2" stroke-linecap="square"/></svg>';

      // ---- build cards ----
      var cards = [];
      for (var c = 0; c < NCARDS; c++) {
        var el = document.createElement("div");
        el.className = "08-fenced-merge-card 08-fenced-merge-mono";
        var stale = c < NE && EVENTS[c].kind === "stale";
        if (stale) el.setAttribute("data-stale", "1");
        el.innerHTML = "<i></i><span>p-" + String(142 + c * 7).padStart(4, "0") + "</span>";
        cardsLayer.appendChild(el);
        cards.push(el);
      }

      // ---- build readout states + dots ----
      var casEls = [];
      var dots = [];
      var passIdx = 0;
      for (var e = 0; e < NE; e++) {
        var ev = EVENTS[e];
        var s = document.createElement("div");
        s.className = "08-fenced-merge-cas";
        if (ev.kind === "pass") {
          var nw = passIdx === 1 ? firstNew : hex7();
          if (passIdx === 0) nw = head; // first commit establishes head a1f3c9e
          if (passIdx === 0) {
            s.innerHTML = "<b>CAS</b> refs/heads/main&nbsp;&nbsp;0000000 → " + nw + CHECK;
          } else {
            s.innerHTML = "<b>CAS</b> refs/heads/main&nbsp;&nbsp;" + head + " → " + nw + CHECK;
          }
          head = nw;
          ev.dot = passIdx;
          var d = document.createElement("div");
          d.className = "08-fenced-merge-dot";
          d.style.left = passIdx * DOT_GAP + "px";
          dotsLayer.appendChild(d);
          dots.push(d);
          passIdx++;
        } else {
          s.innerHTML = "<b>CAS</b> refs/heads/main&nbsp;&nbsp;<em>c40be71 ≠ " + head + "</em>" + CROSS;
        }
        readout.appendChild(s);
        casEls.push(s);
      }

      // ---- static initial states ----
      gsap.set(cards, { x: -200 - CARD_HALF, opacity: 0 });
      gsap.set(dots, { scale: 0 });
      gsap.set(casEls, { opacity: 0 });

      // ---- camera: one slow push across the shot ----
      tl.fromTo(stage, { scale: 1 }, { scale: 1.035, duration: DUR, ease: "sine.inOut" }, 0);

      // ---- Scene 1: gate + strand present, gate locks shut on "fenced merge" ----
      tl.fromTo(posts, { scaleY: 0.4, opacity: 0 }, { scaleY: 1, opacity: 1, duration: 0.36, ease: "power3.out", stagger: 0.06 }, 0.02);
      tl.fromTo(fill, { scaleX: 0 }, { scaleX: 0, duration: 0.01 }, 0);
      tl.fromTo(kicker, { opacity: 0, x: -24 }, { opacity: 1, x: 0, duration: 0.4, ease: "power2.out" }, 0.1);
      tl.fromTo($("strand"), { scaleX: 0.2, opacity: 0, transformOrigin: "0 50%" }, { scaleX: 1, opacity: 1, duration: 0.5, ease: "power3.out" }, 0.08);
      tl.fromTo($("lane"), { opacity: 0 }, { opacity: 1, duration: 0.4 }, 0.2);
      tl.fromTo($("ref"), { opacity: 0, y: 8 }, { opacity: 1, y: 0, duration: 0.35, ease: "power2.out" }, 0.3);
      // the lock: bar slams down between the posts
      tl.fromTo(bar, { y: -240, opacity: 0 }, { y: 0, opacity: 1, duration: 0.3, ease: "power4.in" }, 0.42);
      // clack: gate shudder
      tl.fromTo(gate, { x: 0 }, { x: 7, duration: 0.035, ease: "none" }, 0.72);
      tl.fromTo(gate, { x: 7 }, { x: -5, duration: 0.05, ease: "none", immediateRender: false }, 0.755);
      tl.fromTo(gate, { x: -5 }, { x: 0, duration: 0.08, ease: "power2.out", immediateRender: false }, 0.805);
      tl.fromTo(label, { opacity: 0, y: 10, scaleX: 1.25 }, { opacity: 1, y: 0, scaleX: 1, duration: 0.45, ease: "power3.out" }, 0.74);

      // ---- queue mechanics ----
      function slotX(i) {
        return SLOTS[i] - CARD_HALF;
      }
      // initial queue streams in on "one publisher" (1.3s)
      for (var q = 0; q < SLOTS.length; q++) {
        tl.fromTo(
          cards[q],
          { x: -220 - CARD_HALF, opacity: 0 },
          { x: slotX(q), opacity: 1, duration: 0.35, ease: "power3.out", immediateRender: false },
          1.28 + q * 0.05
        );
      }

      var holdIdx = -1;
      var fillPrev = 0;
      for (var m = 0; m < NE; m++) {
        var E = EVENTS[m];
        var fast = !!E.fast;
        var advD = fast ? 0.07 : 0.2;
        var front = cards[m];

        // everyone behind advances one slot
        for (var cc = m + 1; cc <= m + SLOTS.length - 1 && cc < NCARDS; cc++) {
          var from = cc - m; // slot index before
          tl.fromTo(
            cards[cc],
            { x: slotX(from) },
            { x: slotX(from - 1), duration: advD, ease: "power2.out", immediateRender: false },
            E.t + (fast ? 0.02 : 0.08)
          );
        }
        // a new card enters the back slot
        var nc = m + SLOTS.length;
        if (nc < NCARDS) {
          tl.fromTo(
            cards[nc],
            { x: -220 - CARD_HALF, opacity: 0 },
            { x: slotX(SLOTS.length - 1), opacity: 1, duration: fast ? 0.09 : 0.3, ease: "power2.out", immediateRender: false },
            E.t + (fast ? 0.02 : 0.1)
          );
        }

        // readout swaps to this CAS (discrete state)
        var showAt = m === 0 ? 2.56 : E.t;
        tl.set(casEls, { opacity: 0 }, showAt);
        tl.set(casEls[m], { opacity: 1 }, showAt);
        if (m === 0) {
          tl.fromTo(readout, { y: 14, opacity: 0 }, { y: 0, opacity: 1, duration: 0.25, ease: "power3.out" }, 2.56);
        }

        if (E.kind === "pass") {
          var passD = fast ? 0.075 : 0.26;
          var liftUp = fast ? 0.025 : 0.08;
          var liftDn = fast ? 0.045 : 0.12;
          var dnAt = fast ? E.t + 0.035 : E.t + passD * 0.8;
          // gate opens for exactly one
          tl.fromTo(bar, { y: 0 }, { y: -74, duration: liftUp, ease: "power2.out", immediateRender: false }, E.t - 0.01);
          tl.fromTo(bar, { y: -74 }, { y: 0, duration: liftDn, ease: "power3.in", immediateRender: false }, dnAt);
          // card goes through and collapses into a commit
          tl.fromTo(
            front,
            { x: slotX(0), scale: 1, opacity: 1 },
            { x: GATE_X + 70 - CARD_HALF, scale: 0.15, opacity: 0, duration: passD, ease: "power2.in", immediateRender: false },
            E.t
          );
          // commit dot snaps onto the straight strand
          var dt = E.t + passD * 0.85;
          tl.fromTo(dots[E.dot], { scale: 0 }, { scale: 1, duration: fast ? 0.12 : 0.3, ease: "back.out(3)", immediateRender: false }, dt);
          var headX = DOT_X0 + E.dot * DOT_GAP;
          var nextFill = (headX - STRAND_L) / STRAND_W;
          tl.fromTo(fill, { scaleX: fillPrev }, { scaleX: nextFill, duration: fast ? 0.08 : 0.24, ease: "power2.out", immediateRender: false }, dt);
          fillPrev = nextFill;
        } else {
          // stale base: hits the fence, bounces back, held on a shelf
          holdIdx = m;
          tl.fromTo(front, { x: slotX(0) }, { x: slotX(0) + 18, duration: 0.07, ease: "power2.in", immediateRender: false }, E.t);
          tl.fromTo(gate, { x: 0 }, { x: 6, duration: 0.03, ease: "none", immediateRender: false }, E.t + 0.07);
          tl.fromTo(gate, { x: 6 }, { x: 0, duration: 0.12, ease: "power2.out", immediateRender: false }, E.t + 0.1);
          tl.fromTo(
            front,
            { x: slotX(0) + 18, y: 0, rotation: 0 },
            { x: 400 - CARD_HALF, y: 150, rotation: -7, duration: 0.55, ease: "power3.out", immediateRender: false },
            E.t + 0.07
          );
          tl.fromTo(
            chip,
            { opacity: 0, scale: 0.6, y: -12 },
            { opacity: 1, scale: 1, y: 0, duration: 0.36, ease: "back.out(2.2)" },
            E.t + 0.22
          );
        }
      }

      // ---- Scene 4: stat cards + counters ----
      var stats = [$("stat-merged"), $("stat-lost")];
      tl.fromTo(stats, { opacity: 0, y: 24 }, { opacity: 1, y: 0, duration: 0.4, ease: "power3.out", stagger: 0.1 }, 4.28);
      var rules = root.querySelectorAll('[class~="08-fenced-merge-stat-rule"]');
      tl.fromTo(rules, { scaleX: 0 }, { scaleX: 1, duration: 0.5, ease: "power3.out", stagger: 0.1 }, 4.32);
