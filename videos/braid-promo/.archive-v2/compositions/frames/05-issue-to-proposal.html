      const sw = { ms: 0 };
      tl.fromTo(sw, { ms: 0 }, {
        ms: 39, duration: 0.36, ease: "none",
        onUpdate: () => {
          bigN.textContent = String(Math.round(sw.ms));
          hand.setAttribute("transform", "rotate(" + (sw.ms * 9.2).toFixed(1) + " 13 17)");
        },
      }, SNAP);
      tl.fromTo($("big"), { scale: 1.1 }, { scale: 1, duration: 0.35, ease: "back.out(2.4)" }, SNAP + 0.36);
      tl.fromTo($("watch-sub"), { opacity: 0 }, { opacity: 1, duration: 0.3 }, SNAP + 0.5);

      // ── Scene 4 (5.4–8.6): asr-keyword-glow on each answer as it is spoken ──
      const TIMINGS = {
        type: { start: 5.4, end: 5.8 },
        priority: { start: 5.9, end: 6.4 },
        owner: { start: 6.6, end: 7.1 },
        urgent: { start: 8.1, end: 8.9 },
      };
      const ATTACK = 0.12, RELEASE = 0.4, REST = 0.12, MAX_BLUR = 36, BOOST = 0.18;
      const REST_RGB = { r: 255, g: 253, b: 248 }, ACT_RGB = { r: 255, g: 104, b: 30 };
      function env(t, s, e) {
        if (t < s) return 0;
        if (t < e) return Math.min((t - s) / ATTACK, 1);
        if (t < e + RELEASE) return 1 - ((t - e) / RELEASE) * (1 - REST);
        return REST;
      }
      const lerp = (a, b, k) => Math.round(a + (b - a) * k);
      const glowItems = rows.map((row) => ({
        k: row.dataset.k,
        a: row.getElementsByClassName(P + "a")[0],
        v: row.getElementsByClassName(P + "v")[0],
        hl: row.getElementsByClassName(P + "hl")[0],
      }));
      const gd = { t: 0 };
      tl.fromTo(gd, { t: 0 }, {
        t: D, duration: D, ease: "none",
        onUpdate: () => {
          glowItems.forEach((it) => {
            const tm = TIMINGS[it.k];
            const e = env(gd.t, tm.start, tm.end);
            const col = "rgb(" + lerp(REST_RGB.r, ACT_RGB.r, e) + "," + lerp(REST_RGB.g, ACT_RGB.g, e) + "," + lerp(REST_RGB.b, ACT_RGB.b, e) + ")";
            it.a.style.color = col;
            it.a.style.textShadow = "0 0 " + (MAX_BLUR * e).toFixed(1) + "px rgba(255,104,30," + (0.75 * e).toFixed(3) + ")";
            it.a.style.transform = "scale(" + (1 + BOOST * e).toFixed(4) + ")";
            it.v.style.color = col;
            it.hl.style.opacity = (0.09 * e).toFixed(3);
          });
        },
      }, 0);

      // ── Scene 5 (8.6–10.6): stamp thunks on; strand spins off; progress rail runs ──
      tl.fromTo($("stamp"), { opacity: 0, scale: 1.7, rotation: -10 }, { opacity: 1, scale: 1, rotation: -4, duration: 0.2, ease: "power4.in" }, 8.7);
      tl.fromTo($("panel"), { y: 0 }, { y: 5, duration: 0.06, ease: "power2.out" }, 8.9);
      tl.to($("panel"), { y: 0, duration: 0.25, ease: "back.out(3)" }, 8.96);

      const strand = $("strand");
      const LEN = strand.getTotalLength();
      strand.style.strokeDasharray = LEN;
      tl.fromTo(strand, { strokeDashoffset: LEN }, { strokeDashoffset: 0, duration: 0.55, ease: "power2.inOut" }, 8.95);
      tl.fromTo($("rail-lbl"), { opacity: 0, x: -12 }, { opacity: 1, x: 0, duration: 0.25, ease: "power2.out" }, 9.35);
      tl.fromTo($("rail"), { opacity: 0 }, { opacity: 1, duration: 0.15 }, 9.45);
      tl.fromTo($("rail-fill"), { scaleX: 0 }, { scaleX: 1, duration: 0.8, ease: "power1.inOut" }, 9.5);

      const RAIL = [
        { t: 0, text: "WORKING" },
        { t: 9.5, text: "READING #142" },
        { t: 9.78, text: "PATCHING" },
        { t: 10.05, text: "RUNNING TESTS" },
        { t: 10.3, text: "DONE" },
      ];
      const railText = $("rail-text");
      const rd = { t: 0 };
      tl.fromTo(rd, { t: 0 }, {
        t: D, duration: D, ease: "none",
        onUpdate: () => {
          let s = RAIL[0].text;
          for (let i = RAIL.length - 1; i >= 0; i--) if (rd.t >= RAIL[i].t) { s = RAIL[i].text; break; }
          railText.textContent = s;
        },
      }, 0);

      // ── Scene 6 (10.1–12.7): proposal card slides out at the strand's end; coffee pops; hold ──
      tl.fromTo($("prop"),
        { y: -40, opacity: 0, clipPath: "inset(0% 0% 100% 0%)" },
        { y: 0, opacity: 1, clipPath: "inset(0% 0% 0% 0%)", duration: 0.5, ease: "power3.out" }, 10.25);
      tl.fromTo($("coffee"), { opacity: 0, scale: 0.6 }, { opacity: 1, scale: 1, duration: 0.35, ease: "back.out(2.2)" }, 12.0);

      tl.set({}, {}, D);
      window.__timelines["05-issue-to-proposal"] = tl;
    })();
  </script>
</template>
