  <script>
    (function () {
      const ID = "02-main-on-fire";
      const DUR = 5.637;
      const root = document.querySelector('[data-composition-id="' + ID + '"]');
      const byId = (s) => root.querySelector('[id="' + ID + "-" + s + '"]');
      const cls = (s) => Array.from(root.getElementsByClassName(ID + "-" + s));

      // deterministic PRNG (mulberry32)
      let seed = 20260209;
      const rand = () => {
        seed |= 0;
        seed = (seed + 0x6d2b79f5) | 0;
        let t = Math.imul(seed ^ (seed >>> 15), 1 | seed);
        t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
        return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
      };

      // ---- build the strand: 8 segments carrying impact beads ----
      const strand = byId("strand");
      const SEGS = 8;
      const SEG_W = 240;
      const segs = [];
      for (let i = 0; i < SEGS; i++) {
        const s = document.createElement("div");
        s.className = ID + "-seg";
        s.style.left = i * SEG_W - 2 + "px";
        strand.appendChild(s);
        segs.push(s);
      }
      // beads ride inside each segment's coordinate frame (wrapper not clipped)
      const beadHosts = segs.map((s, i) => {
        const h = document.createElement("div");
        h.style.position = "absolute";
        h.style.left = i * SEG_W - 2 + "px";
        h.style.top = "593px";
        h.style.width = "244px";
        h.style.height = "14px";
        h.style.transformOrigin = "50% 50%";
        strand.appendChild(h);
        return h;
      });
      const dots = [];
      const DOTS = 40;
      for (let k = 0; k < DOTS; k++) {
        const segIdx = Math.floor(rand() * SEGS);
        const d = document.createElement("div");
        d.className = ID + "-dot";
        d.style.left = 20 + rand() * 204 + "px";
        beadHosts[segIdx].appendChild(d);
        const fromAbove = rand() < 0.55;
        dots.push({
          el: d,
          dy: (fromAbove ? -1 : 1) * (380 + rand() * 420),
          dx: (rand() - 0.5) * 160,
          t: (k / DOTS) * 1.5,
        });
      }
      // shards at break points
      const shards = [];
      for (let k = 0; k < 18; k++) {
        const b = 1 + (k % (SEGS - 1));
        const sh = document.createElement("div");
        sh.className = ID + "-shard";
        sh.style.left = b * SEG_W - 17 + "px";
        sh.style.top = "596px";
        strand.appendChild(sh);
        const ang = rand() * Math.PI * 2;
        const dist = 90 + rand() * 220;
        shards.push({
          el: sh,
          x: Math.cos(ang) * dist,
          y: Math.sin(ang) * dist * 0.8,
          r: (rand() - 0.5) * 540,
          t: k < 9 ? 2.5 + k * 0.012 : 3.1 + (k - 9) * 0.012,
        });
      }

      const tl = gsap.timeline({ paused: true });

      // ---- Scene 1 (0.0–0.7): strand present, dots slam in ----
      dots.forEach((d) => {
        tl.fromTo(
          d.el,
          { x: d.dx, y: d.dy, scaleX: 1, scaleY: 1, opacity: 1 },
          { x: 0, y: 0, duration: 0.24, ease: "power3.in" },
          d.t
        );
        tl.to(d.el, { scaleX: 1.5, scaleY: 0.55, duration: 0.07, ease: "power2.out" }, d.t + 0.24);
      });

      // segment state helpers
      const segTo = (vals, t, dur, ease) => {
        segs.forEach((s, i) => {
          const v = vals[i];
          tl.to([s, beadHosts[i]], { x: v[0], y: v[1], rotation: v[2], duration: dur, ease: ease }, t);
        });
      };
      // establish rest state so seeking back to 0 is clean
      tl.set(segs.concat(beadHosts), { x: 0, y: 0, rotation: 0 }, 0);

      // ---- Scene 2 (0.7): strand kinks ----
      segTo(
        [
          [0, 0, 0],
          [0, 4, 2],
          [0, -14, -5],
          [0, 18, 7],
          [0, -10, -4],
          [0, 12, 5],
          [0, -6, -2],
          [0, 2, 1],
        ],
        0.7,
        0.28,
        "back.out(3)"
      );

      // ---- Scene 3 (1.6 rebase: wrench; 2.5 conflict: splits into frayed shards) ----
      segTo(
        [
          [0, 6, 2],
          [0, -10, -6],
          [0, 22, 9],
          [0, -24, -10],
          [0, 20, 8],
          [0, -14, -7],
          [0, 10, 4],
          [0, -4, -2],
        ],
        1.6,
        0.3,
        "back.out(2.5)"
      );
      segTo(
        [
          [-40, 30, 8],
          [-24, -46, -16],
          [-10, 60, 22],
          [-6, -70, -28],
          [10, 64, 24],
          [18, -52, -18],
          [30, 40, 14],
          [44, -22, -8],
        ],
        2.5,
        0.32,
        "expo.out"
      );
      // ---- Scene 4 (3.1 force push): shards blown further apart ----
      segTo(
        [
          [-90, 70, 18],
          [-60, -110, -34],
          [-30, 140, 40],
          [-14, -150, -48],
          [24, 130, 44],
          [48, -120, -36],
          [70, 96, 30],
          [100, -60, -20],
        ],
        3.1,
        0.35,
        "expo.out"
      );
      shards.forEach((s) => {
        tl.fromTo(
          s.el,
          { x: 0, y: 0, rotation: 0, opacity: 0 },
          { x: s.x, y: s.y, rotation: s.r, opacity: 1, duration: 0.45, ease: "expo.out" },
          s.t
        );
      });

      // ---- toasts pile in from every edge on their VO cues ----
      cls("toast").forEach((el) => {
        const t = parseFloat(el.dataset.t);
        const r = parseFloat(el.dataset.r);
        if (el.dataset.slam) {
          tl.fromTo(
            el,
            { scale: 1.9, rotation: r - 6, opacity: 0 },
            { scale: 1, rotation: r, opacity: 1, duration: 0.16, ease: "power4.in" },
            t
          );
        } else {
          tl.fromTo(
            el,
            {
              x: parseFloat(el.dataset.dx),
              y: parseFloat(el.dataset.dy),
              scale: 1.14,
              rotation: r * 2.5,
              opacity: 0,
            },
            { x: 0, y: 0, scale: 1, rotation: r, opacity: 1, duration: 0.2, ease: "power4.out" },
            t
          );
        }
      });

      // ---- screen shakes: conflict (small), force push (hard) ----
      const world = byId("world");
      tl.set(world, { x: 0, y: 0 }, 0);
      tl.to(
        world,
        {
          keyframes: [
            { x: -8, y: 5, duration: 0.05 },
            { x: 6, y: -4, duration: 0.05 },
            { x: -3, y: 2, duration: 0.05 },
            { x: 0, y: 0, duration: 0.05 },
          ],
          ease: "none",
        },
        2.5
      );
      tl.to(
        world,
        {
          keyframes: [
            { x: -26, y: 14, duration: 0.05 },
            { x: 22, y: -12, duration: 0.05 },
            { x: -16, y: 9, duration: 0.05 },
            { x: 11, y: -6, duration: 0.05 },
            { x: -6, y: 3, duration: 0.05 },
            { x: 0, y: 0, duration: 0.06 },
          ],
          ease: "none",
        },
        3.26
      );

      // ---- Scene 5 (4.2): headline punches in over the pile ----
      tl.fromTo(byId("veil"), { opacity: 0 }, { opacity: 0.55, duration: 0.18, ease: "power2.out" }, 4.2);
      tl.fromTo(
        byId("headline"),
        { scale: 1.45, opacity: 0, rotation: -2 },
        { scale: 1, opacity: 1, rotation: -1, duration: 0.22, ease: "expo.out" },
        4.2
      );
      tl.fromTo(byId("rule"), { scaleX: 0, opacity: 1 }, { scaleX: 1, duration: 0.2, ease: "power3.out" }, 4.3);
      tl.to(
        world,
        {
          keyframes: [
            { x: -10, y: 6, duration: 0.04 },
            { x: 7, y: -4, duration: 0.04 },
            { x: 0, y: 0, duration: 0.05 },
          ],
          ease: "none",
        },
        4.38
      );

      // ---- hold the chaos: subtle jitter on pile + strand (onUpdate sine form) ----
      const pile = byId("pile");
      const top = byId("top");
      const phase = { p: 0 };
      const IDLE_START = 4.55;
      const IDLE_DUR = DUR - IDLE_START;
      const CYCLES = 3;
      tl.fromTo(
        phase,
        { p: 0 },
        {
          p: Math.PI * 2 * CYCLES,
          duration: IDLE_DUR,
          ease: "none",
          onUpdate: () => {
            const p = phase.p;
            const a = Math.sin(p * 2.3) * 2.5 + Math.sin(p * 5.1) * 1;
            const b = Math.sin(p * 1.9) * 2 + Math.sin(p * 4.3) * 0.8;
            pile.style.transform = "translate(" + a.toFixed(2) + "px," + b.toFixed(2) + "px)";
            strand.style.transform = "translate(" + (-b).toFixed(2) + "px," + a.toFixed(2) + "px)";
            top.style.transform = "translate(" + (Math.sin(p * 1.7) * 1.5).toFixed(2) + "px,0px)";
          },
        },
        IDLE_START
      );

      window.__timelines = window.__timelines || {};
      window.__timelines[ID] = tl;
    })();
  </script>
